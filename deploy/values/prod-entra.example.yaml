# Production with Microsoft Entra ID directly.
# App Registration: Web redirect URI https://vdi.example.com/hub/oauth_callback,
# App Roles "vdi-users" and "vdi-admins" assigned to Entra groups, token claim "roles".
# Secret "k8svdi-oidc" (key client-secret) is provided externally, e.g. External Secrets + Key Vault.
host: vdi.example.com
auth:
  provider: entra
  clientId: 11111111-1111-1111-1111-111111111111
  allowedGroups: [vdi-users]
  adminGroups: [vdi-admins]
  entra:
    tenantId: 22222222-2222-2222-2222-222222222222
    groupsClaim: roles
jupyterhub:
  ingress:
    ingressClassName: nginx
    hosts: [vdi.example.com]
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - {hosts: [vdi.example.com], secretName: vdi-tls}
  singleuser:
    image: {name: myregistry.azurecr.io/vdi-desktop, tag: "0.1.0"}
    storage:
      dynamic: {storageClass: managed-csi}
